<!-- Chatbot Script - Non-module version to avoid import issues -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const messagesContainer = document.getElementById('chatbotMessages');
        const inputField = document.getElementById('chatbotInput');
        const sendButton = document.getElementById('sendQueryBtn');
        
        // ChatbotService functionality inline to avoid module issues
        const apiUrl = 'http://localhost:5000/api/chatbot';
        
        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser ? 'user-message' : 'bot-message';
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        async function sendQuery() {
            const query = inputField.value.trim();
            if (!query) return;
            
            // Add user message
            addMessage(query, true);
            inputField.value = '';
            
            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'bot-message typing';
            typingDiv.textContent = '...';
            messagesContainer.appendChild(typingDiv);
            
            try {
                // Send query to API
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query }),
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Remove typing indicator
                messagesContainer.removeChild(typingDiv);
                
                // Add bot response
                addMessage(data.message || "I couldn't understand that query.");
                
                // If there's result data, display it
                if (data.result_data && data.result_data.length > 0) {
                    const dataDiv = document.createElement('div');
                    dataDiv.className = 'bot-message data-message';
                    dataDiv.innerHTML = `<strong>Found ${data.result_data.length} results:</strong>`;
                    
                    // Create a simple table for the first 5 results
                    const table = document.createElement('table');
                    table.className = 'results-table';
                    
                    // Add headers
                    // Replace the line with:
const headers = Object.keys(data.result_data[0]).slice(0, 5); // Limit to 5 columns
                    const headerRow = document.createElement('tr');
                    headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    table.appendChild(headerRow);
                    
                    // Add data rows (max 5)
                    data.result_data.slice(0, 5).forEach(item => {
                        const row = document.createElement('tr');
                        headers.forEach(header => {
                            const td = document.createElement('td');
                            td.textContent = item[header] || '';
                            row.appendChild(td);
                        });
                        table.appendChild(row);
                    });
                    
                    dataDiv.appendChild(table);
                    messagesContainer.appendChild(dataDiv);
                }
           } catch (error) {
    // Remove typing indicator
    if (typingDiv.parentNode) {
        messagesContainer.removeChild(typingDiv);
    }
    
    // Show error message with more details
    addMessage('Sorry, there was an error processing your request: ' + 
        (error.message || 'Unknown error'));
    console.error('Chatbot request error:', error);
}
        }
        
        // Event listeners
        if (sendButton) {
            sendButton.addEventListener('click', sendQuery);
        }
        
        if (inputField) {
            inputField.addEventListener('keypress', event => {
                if (event.key === 'Enter') {
                    sendQuery();
                }
            });
        }
    });
</script>

<script>
       document.addEventListener('DOMContentLoaded', function() {
    // DOM Elements
    const messagesContainer = document.getElementById('chatbotMessages');
    const inputField = document.getElementById('chatbotInput');
    const sendButton = document.getElementById('sendQueryBtn');
    const chatToggleBtn = document.getElementById('chatToggleBtn');
    const chatbotContainer = document.querySelector('.chatbot-container');
    const closeChat = document.getElementById('closeChat');
    const chatbotHeader = document.querySelector('.chatbot-header');
    
    // Track state
    const userId = 'user_' + new Date().getTime(); // Simple user ID for context tracking
    let lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;
    let ticking = false;
    let isFollowingScroll = true; // Set to false if user has dragged the chatbot
    let isDragging = false;
    let offsetX, offsetY;
    
    // API endpoint
    const apiUrl = 'http://localhost:5000/api/chatbot';
    
    // ===== SCROLL FOLLOWING FUNCTIONALITY =====
    
    // Initial position - middle right
    positionChatAtViewportMiddle();
    
    // Follow scroll position
    window.addEventListener('scroll', function() {
        if (!isFollowingScroll) return; // Skip if user has manually positioned
        
        lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
        if (!ticking) {
            window.requestAnimationFrame(function() {
                positionChatAtViewportMiddle();
                ticking = false;
            });
            
            ticking = true;
        }
    });
    
    // Update on window resize
    window.addEventListener('resize', function() {
        if (!isFollowingScroll) return;
        positionChatAtViewportMiddle();
    });
    
    // Position chatbot in the middle of current viewport
    function positionChatAtViewportMiddle() {
        if (!chatToggleBtn) return;
        
        // Get viewport height
        const viewportHeight = window.innerHeight;
        
        // Position in the middle of the current viewport
        const middlePosition = viewportHeight / 2;
        
        // Apply position to chat button
        chatToggleBtn.style.top = `${middlePosition + window.pageYOffset}px`;
        chatToggleBtn.style.transform = 'translateY(-50%)';
        
        // Also update chatbot container position if it's open
        if (chatbotContainer && chatbotContainer.style.display === 'block') {
            chatbotContainer.style.top = `${middlePosition + window.pageYOffset}px`;
            chatbotContainer.style.transform = 'translateY(-50%)';
        }
    }
    
    // ===== DRAGGABLE FUNCTIONALITY =====
    
    if (chatbotContainer && chatbotHeader) {
        // Make the header indicate it's draggable
        chatbotHeader.style.cursor = 'grab';
        
        // Start dragging
        chatbotHeader.addEventListener('mousedown', function(e) {
            isDragging = true;
            
            // Get the current position of the mouse relative to the chatbot
            offsetX = e.clientX - chatbotContainer.getBoundingClientRect().left;
            offsetY = e.clientY - chatbotContainer.getBoundingClientRect().top;
            
            // Change cursor to indicate dragging
            chatbotHeader.style.cursor = 'grabbing';
        });
        
        // Stop dragging
        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                chatbotHeader.style.cursor = 'grab';
            }
        });
        
        // Move while dragging
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            // Disable scroll following when user manually drags
            isFollowingScroll = false;
            
            // Calculate new position
            const newX = e.clientX - offsetX;
            const newY = e.clientY - offsetY;
            
            // Apply new position with boundaries
            chatbotContainer.style.right = 'auto';
            chatbotContainer.style.bottom = 'auto';
            chatbotContainer.style.left = Math.max(0, Math.min(window.innerWidth - chatbotContainer.offsetWidth, newX)) + 'px';
            chatbotContainer.style.top = Math.max(0, Math.min(window.innerHeight - chatbotContainer.offsetHeight, newY)) + 'px';
            chatbotContainer.style.transform = 'none';
        });
        
        
    }
    
    // ===== TOGGLE FUNCTIONALITY =====
    
    if (chatToggleBtn && chatbotContainer) {
        // Show chatbot
        chatToggleBtn.addEventListener('click', function() {
            chatbotContainer.style.display = 'block';
            
            // Position container near the button
            if (isFollowingScroll) {
                chatbotContainer.style.top = chatToggleBtn.style.top;
                chatbotContainer.style.transform = 'translateY(-50%)';
            }
            
            // Add animation class with slight delay
            setTimeout(() => {
                chatbotContainer.classList.add('visible');
            }, 10);
            
            // Focus on input field
            if (inputField) {
                setTimeout(() => inputField.focus(), 300);
            }
        });
        
        // Hide chatbot
        if (closeChat) {
            closeChat.addEventListener('click', function() {
                chatbotContainer.classList.remove('visible');
                // Wait for animation to finish before hiding
                setTimeout(() => {
                    chatbotContainer.style.display = 'none';
                }, 400);
            });
        }
    }
    // ===== MESSAGE FUNCTIONALITY =====
    
    function addMessage(text, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = isUser ? 'user-message' : 'bot-message';
        messageDiv.textContent = text;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function addTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'bot-message typing';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        messagesContainer.appendChild(typingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return typingDiv;
    }
    
    function addDetailsMessage(details) {
        if (!details) return;
        
        const detailsDiv = document.createElement('div');
        detailsDiv.className = 'details-message';
        detailsDiv.innerHTML = details.replace(/\n/g, '<br>');
        messagesContainer.appendChild(detailsDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function createTable(data, maxRows = 10) {
        if (!data || !data.length) return null;
        
        // Limit columns for better UX
        const headers = Object.keys(data[0]).slice(0, 5);
        
        const table = document.createElement('table');
        table.className = 'results-table';
        
        // Create header row
        const headerRow = document.createElement('tr');
        headers.forEach(header => {
            const th = document.createElement('th');
            th.textContent = header;
            headerRow.appendChild(th);
        });
        table.appendChild(headerRow);
        
        // Create data rows
        data.slice(0, maxRows).forEach(item => {
            const row = document.createElement('tr');
            headers.forEach(header => {
                const td = document.createElement('td');
                td.textContent = item[header] || '';
                row.appendChild(td);
            });
            table.appendChild(row);
        });
        
        return table;
    }
    
    async function sendQuery() {
        const query = inputField.value.trim();
        if (!query) return;
        
        // Add user message
        addMessage(query, true);
        inputField.value = '';
        
        // Show typing indicator
        const typingDiv = addTypingIndicator();
        
        try {
            // Send query to API with user context
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    query,
                    user_id: userId
                }),
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            
            // Remove typing indicator
            messagesContainer.removeChild(typingDiv);
            
            // Add bot response
            addMessage(data.message || "I couldn't understand that query.");
            
            // If there are details, show them
            if (data.details) {
                addDetailsMessage(data.details);
            }
            
            // If there's result data, display it
            if (data.result_data && data.result_data.length > 0) {
                const dataDiv = document.createElement('div');
                dataDiv.className = 'data-message';
                
                // Create the results table
                const table = createTable(data.result_data);
                if (table) {
                    dataDiv.appendChild(table);
                    
                    // Add note if there are more results than shown
                    if (data.result_data.length > 10) {
                        const noteP = document.createElement('p');
                        noteP.style.fontSize = '0.8rem';
                        noteP.style.fontStyle = 'italic';
                        noteP.style.marginTop = '5px';
                        noteP.textContent = `Showing 10 of ${data.result_data.length} results.`;
                        dataDiv.appendChild(noteP);
                    }
                    
                    messagesContainer.appendChild(dataDiv);
                }
            }
            
            // Scroll to the bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
        } catch (error) {
            // Remove typing indicator
            if (typingDiv.parentNode) {
                messagesContainer.removeChild(typingDiv);
            }
            
            // Show error message
            addMessage('Sorry, there was an error connecting to the chatbot service. Please check if the API is running.');
            console.error('Chatbot request error:', error);
        }
    }
    
    // Event listeners for sending messages
    if (sendButton) {
        sendButton.addEventListener('click', sendQuery);
    }
    
    if (inputField) {
        inputField.addEventListener('keypress', event => {
            if (event.key === 'Enter') {
                sendQuery();
            }
        });
    }
    
    // Suggest some example queries
    setTimeout(() => {
        const suggestionsDiv = document.createElement('div');
        suggestionsDiv.className = 'bot-message';
        suggestionsDiv.innerHTML = "You can ask me questions like:<br>" +
            "• How many players are under 26?<br>" +
            "• List all clubs<br>" +
            "• Tell me about football in Africa<br>" +
            "• Who are the sponsors?";
        messagesContainer.appendChild(suggestionsDiv);
    }, 1000);
});
</script>
