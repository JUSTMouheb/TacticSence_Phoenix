<!-- Step 4: Success -->
<div *ngIf="signupStep === 4" class="success-container">
  <div class="success-dialog">
    <!-- Close button -->
    <button type="button" class="btn-close position-absolute top-0 end-0 m-3" 
            (click)="resetSignupForm(); loginModal.hide();" aria-label="Close"></button>
    
    <!-- Success icon -->
    <div class="success-icon mb-4">
      <div class="icon-circle">
        <i class="bi bi-check-lg"></i>
      </div>
    </div>
    
    <!-- Title and text -->
    <h2 class="dialog-title">Verification Successful</h2>
    <p class="dialog-subtitle mb-4">Your identity has been verified. You can now access the platform.</p>
    
    <!-- Role badge -->
    <div class="role-badge mb-4">
      <span class="badge bg-light text-dark">{{ signupRole }}</span>
    </div>
    
    <!-- Action buttons -->
    <div class="action-buttons">
      <button type="button" class="btn btn-primary btn-lg w-100 mb-3" (click)="loginVerified()">
        CONTINUE TO TACTICSENSE
      </button>
      <div class="d-flex justify-content-center">
        <a href="#" class="text-danger me-3" (click)="$event.preventDefault(); forgotPassword()">
          Forgot your password?
        </a>
        <button type="button" class="btn btn-outline-danger" (click)="toggleMode()">
          SIGN IN
        </button>
      </div>
    </div>
  </div>
</div>
